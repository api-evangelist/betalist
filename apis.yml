description: >-
  BetaList is a platform for discovering upcoming internet startups and getting early
  access to innovative products before they go mainstream. Founded in 2010, BetaList
  curates pre-launch and recently launched startups across categories including SaaS,
  AI tools, analytics, developer tools, and more. Startups gain exposure through the
  BetaList website, daily email newsletter, and social media channels. BetaList also
  operates a small read-only REST API at api.betalist.com/v1 covering startups,
  regions, and markets; its documentation is published publicly as a GitHub gist by
  founder Marc Kohlbrugge and linked from the BetaList support page, but access tokens
  are issued case-by-case on request rather than self-service.
apis:
  - name: BetaList API
    description: >-
      Read-only REST API over the BetaList startup directory. Three documented
      collections — startups (list + detail, filterable by region_id and market_id),
      regions (list + detail), and markets (list; markets form a directed acyclic
      graph so a market can have multiple parents and children). Responses are JSON.
      Every request is authenticated with an access_token query-string parameter;
      tokens are granted case-by-case after a request through BetaList's contact form
      or the founder's Typeform. Paging is via per_page (max 100 for startups, 500 for
      regions and markets) and page. Documentation is a public GitHub gist maintained
      by BetaList founder Marc Kohlbrugge and linked from betalist.com/support.
    humanURL: https://gist.github.com/marckohlbrugge/5a29bf1ba628bb4ca960
    baseURL: https://api.betalist.com/v1
    tags:
      - startups
      - startup-directory
      - product-discovery
      - early-adopters
      - company-data
      - rest
    properties:
      - type: Documentation
        url: https://gist.github.com/marckohlbrugge/5a29bf1ba628bb4ca960
      - type: APIReference
        url: https://gist.github.com/marckohlbrugge/5a29bf1ba628bb4ca960
      - type: SignUp
        url: https://marc.typeform.com/to/KOdlOu
    x-evidence:
      verified: '2026-08-13'
      method: probed
      docs_url: https://gist.github.com/marckohlbrugge/5a29bf1ba628bb4ca960
      docs_status: 200
      docs_describes: >-
        Named base URL (api.betalist.com/v1), three named collections with paths,
        query parameters, an authentication parameter, and worked example URLs.
      docs_linked_from: https://betalist.com/support
      endpoint_checks:
        - url: https://api.betalist.com/v1/startups
          status: 401
        - url: https://api.betalist.com/v1/markets
          status: 401
        - url: https://api.betalist.com/v1/regions
          status: 401
        - url: https://api.betalist.com/openapi.json
          status: 404
      note: >-
        The documented routes answer 401 (token required) while undefined paths on the
        same host answer the Rails default 404, so the routes are real and gated rather
        than absent. No machine-readable specification is published anywhere; nothing
        was generated to fill that gap.
